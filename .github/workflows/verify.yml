name: Verify frozen artifact

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: wu350891451-jpg/verify-frozen-artifacts@v0.2.0
        with:
          declaration: artifacts.sha256
          root: .
